services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    network_mode: bridge
    environment:
      NAPCAT_UID: ${NAPCAT_UID}
      NAPCAT_GID: ${NAPCAT_GID}
    ports:
      - "3000:3000"
      - "3001:3001"
      - "6099:6099"
    volumes:
      - ./.container-data/napcat/config:/app/napcat/config
      - ./.container-data/napcat/plugins:/app/napcat/plugins
      - ./.container-data/napcat/qq:/app/.config/QQ
